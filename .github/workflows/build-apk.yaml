name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Permitir Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Assinar APK
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p signed
          "$APKSIGNER" sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out signed/LiquidIPTV.apk "$SRC"
          "$APKSIGNER" verify --verbose signed/LiquidIPTV.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidIPTV-apk
          path: signed/LiquidIPTV.apk
